# Port - matches old Typescript BFF default
quarkus.http.port=9009

# Full backend base URL — must not include a trailing slash
quarkus.rest-client.backend.url=${BACKEND_URL:http://localhost:8080/regel/bekraftabeslut}

# CORS - allow the frontend to call this BFF
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3030}
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Off by default — enable per environment if the frontend needs to send cookies cross-origin
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Informationsaccess events via ILogg — static topic (IA-FR-09.2)
# Kafka address comes from KAFKA_BOOTSTRAP_SERVERS in the environment
#
# TODO: Replace the channel topic with the correct topic for the consuming service
mp.messaging.outgoing.ilogg-event.connector=smallrye-kafka
mp.messaging.outgoing.ilogg-event.topic=informationsaccess
mp.messaging.outgoing.ilogg-event.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Container image
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-template-micro-fe-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
